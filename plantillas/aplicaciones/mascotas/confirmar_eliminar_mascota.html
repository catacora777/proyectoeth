{% extends 'base.html' %}
{% block titulo %}Eliminar mascota - Huellitas{% endblock %}

{% block contenido %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card tarjeta-hueco">
                <div class="card-body p-4 text-center">
                    <i class="bi bi-exclamation-triangle display-3 text-warning"></i>
                    <h3 class="mt-3">¿Eliminar a {{ mascota.nombre }}?</h3>
                    <p class="text-muted">Esta acción no se puede deshacer. Se eliminarán también sus fotos y solicitudes.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2">
                            <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Eliminar</button>
                            <a href="{% url 'mascotas:detalle_mascota' mascota.id %}" class="btn btn-ambar">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
