{% extends 'base.html' %}
{% block titulo %}Reportar animal rescatado - Huellitas{% endblock %}

{% block contenido %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card tarjeta-hueco">
                <div class="card-body p-4">
                    <h3 class="mb-4"><i class="bi bi-bandaid me-2" style="color: #40916c;"></i>Reportar animal rescatado</h3>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="row">
                            {% for campo in formulario %}
                                <div class="col-md-6 mb-3">
                                    <label for="{{ campo.id_for_label }}" class="form-label">{{ campo.label }}</label>
                                    {{ campo }}
                                    {% for error in campo.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
                                </div>
                            {% endfor %}
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-verde"><i class="bi bi-check-circle me-1"></i>Publicar reporte</button>
                            <a href="{% url 'mascotas:listado_rescatados' %}" class="btn btn-ambar">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
